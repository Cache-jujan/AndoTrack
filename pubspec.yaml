name: andotrack_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^11.0.0

  # State management
  flutter_riverpod: ^2.5.0

  # Background tasks
  flutter_foreground_task: ^8.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Network
  connectivity_plus: ^6.0.0
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.0

# QR
  qr_flutter: ^4.1.0
  gal: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true